<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    
    # Set environment variable for token file location
    SetEnv TOKEN_FILE /mnt/fileserver-app/saved.token.json
    SetEnv PYTHONPATH /mnt/fileserver-app

    # WSGI configuration
    WSGIDaemonProcess nuotti_fileserver python-path=/mnt/fileserver-app:/mnt/fileserver-app/venv/lib/python3.10/site-packages python-home=/mnt/fileserver-app/venv user=www-data group=www-data threads=5
    WSGIScriptAlias /nuotti_fileserver /mnt/fileserver-app/wsgi.py process-group=nuotti_fileserver application-group=%{GLOBAL}

    <Directory /mnt/fileserver-app>
        WSGIProcessGroup nuotti_fileserver
        Require all granted
        Options +ExecCGI
        WSGIScriptReloading On
    </Directory>

    LogLevel info wsgi:debug

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    # Security headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
</VirtualHost> 